<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treatza — Customer Login (test page)</title>
<style>
  :root{
    --cocoa:#2B1B14; --cream:#FBF3E7; --cream2:#F3E7D4; --wheat:#D9A441;
    --jam:#A8324A; --sage:#7C8A6E; --ink:#241812; --inkfaint:#5B4A3F;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink)}
  header{background:var(--cocoa);color:var(--cream);padding:18px 20px}
  header h1{font-size:18px;margin:0}
  main{max-width:380px;margin:40px auto;padding:18px}
  .card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
  .card h2{margin-top:0;font-size:16px}
  input{width:100%;padding:11px;border-radius:8px;border:1.5px solid #ddd;margin:8px 0;font-size:14px}
  button{width:100%;background:var(--jam);color:#fff;border:none;padding:11px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13.5px;margin-top:8px}
  button.secondary{background:var(--cream2);color:var(--ink)}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{margin-top:0}
  .msg{margin-top:12px;font-size:13px;padding:10px;border-radius:8px}
  .msg.error{background:#fde2e2;color:#a12525}
  .msg.ok{background:#e3f0dd;color:#3d6b2c}
  .hidden{display:none}
  pre{background:var(--cream2);padding:12px;border-radius:8px;font-size:12px;overflow:auto}
</style>
</head>
<body>
<header><h1>Treatza — Customer Login (test page)</h1></header>
<main>

  <div class="card" id="authCard">
    <div class="tabs">
      <button onclick="showTab('login')" id="tabLogin">Login</button>
      <button onclick="showTab('signup')" class="secondary" id="tabSignup">Sign up</button>
    </div>

    <div id="loginForm">
      <h2>Login</h2>
      <input id="loginPhone" placeholder="Phone number">
      <input id="loginPassword" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
    </div>

    <div id="signupForm" class="hidden">
      <h2>Sign up</h2>
      <input id="signupName" placeholder="Full name">
      <input id="signupPhone" placeholder="Phone number">
      <input id="signupPassword" type="password" placeholder="Password (min 6 chars)">
      <button onclick="signup()">Create account</button>
    </div>

    <div id="msg"></div>
  </div>

  <div class="card hidden" id="loggedInCard" style="margin-top:16px">
    <h2>Logged in ✅</h2>
    <pre id="userInfo"></pre>
    <button class="secondary" onclick="logout()">Logout</button>
  </div>

</main>
<script>
  const API_BASE = '';
  let token = localStorage.getItem('treatza_customer_token') || '';

  function showTab(which){
    document.getElementById('loginForm').classList.toggle('hidden', which !== 'login');
    document.getElementById('signupForm').classList.toggle('hidden', which !== 'signup');
    document.getElementById('msg').innerHTML = '';
  }

  function showMsg(text, isError){
    document.getElementById('msg').innerHTML = `<div class="msg ${isError ? 'error':'ok'}">${text}</div>`;
  }

  async function signup(){
    const body = {
      name: document.getElementById('signupName').value.trim(),
      phone: document.getElementById('signupPhone').value.trim(),
      password: document.getElementById('signupPassword').value
    };
    const res = await fetch(`${API_BASE}/api/auth/signup`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!res.ok){ showMsg(data.error || 'Signup failed', true); return; }
    onLoggedIn(data);
  }

  async function login(){
    const body = {
      phone: document.getElementById('loginPhone').value.trim(),
      password: document.getElementById('loginPassword').value
    };
    const res = await fetch(`${API_BASE}/api/auth/login`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!res.ok){ showMsg(data.error || 'Login failed', true); return; }
    onLoggedIn(data);
  }

  function onLoggedIn(data){
    token = data.token;
    localStorage.setItem('treatza_customer_token', token);
    document.getElementById('authCard').classList.add('hidden');
    document.getElementById('loggedInCard').classList.remove('hidden');
    document.getElementById('userInfo').textContent = JSON.stringify(data.user, null, 2);
  }

  async function logout(){
    await fetch(`${API_BASE}/api/auth/logout`, { method:'POST', headers:{'Authorization':'Bearer '+token} });
    localStorage.removeItem('treatza_customer_token');
    token = '';
    document.getElementById('authCard').classList.remove('hidden');
    document.getElementById('loggedInCard').classList.add('hidden');
  }

  async function checkExistingSession(){
    if(!token) { showTab('login'); return; }
    const res = await fetch(`${API_BASE}/api/auth/me`, { headers:{'Authorization':'Bearer '+token} });
    if(res.ok){
      const user = await res.json();
      onLoggedIn({ token, user });
    } else {
      localStorage.removeItem('treatza_customer_token');
      token = '';
      showTab('login');
    }
  }

  checkExistingSession();
</script>
</body>
</html>
