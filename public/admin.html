<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treatza — Orders Dashboard</title>
<style>
  :root{
    --cocoa:#2B1B14; --cream:#FBF3E7; --cream2:#F3E7D4; --wheat:#D9A441;
    --jam:#A8324A; --sage:#7C8A6E; --ink:#241812; --inkfaint:#5B4A3F;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--cream);color:var(--ink)}
  header{background:var(--cocoa);color:var(--cream);padding:18px 20px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:18px;margin:0}
  header .status{font-size:12px;color:var(--wheat);font-family:monospace}
  main{max-width:760px;margin:0 auto;padding:18px}
  .login{max-width:340px;margin:80px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,0.08);text-align:center}
  .login input{width:100%;padding:11px;border-radius:8px;border:1.5px solid #ddd;margin:12px 0;font-size:14px}
  .login button, .refresh-btn{background:var(--jam);color:#fff;border:none;padding:11px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13.5px}
  .empty{text-align:center;color:var(--inkfaint);padding:60px 20px}
  .order{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(36,24,18,0.06)}
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .order-id{font-family:monospace;font-weight:700;font-size:15px}
  .order-date{font-size:11.5px;color:var(--inkfaint)}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:6px}
  .tag-cod{background:#eee;color:#555}
  .tag-awaiting{background:#fdf1d6;color:#8a6403}
  .tag-paid{background:#e3ede0;color:#3d5c33}
  .cust{font-size:13.5px;margin:8px 0 4px;font-weight:600}
  .addr{font-size:12.5px;color:var(--inkfaint);margin-bottom:8px}
  .items{font-size:13px;border-top:1px dashed #ddd;border-bottom:1px dashed #ddd;padding:8px 0;margin:8px 0}
  .items div{display:flex;justify-content:space-between;padding:2px 0}
  .total-row{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px;margin-top:6px}
  .status-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .status-btn{flex:1;min-width:80px;padding:9px;border-radius:8px;border:1.5px solid #ddd;background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
  .status-btn.active{background:var(--cocoa);color:var(--cream);border-color:var(--cocoa)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .toolbar span{font-size:12px;color:var(--inkfaint)}
</style>
</head>
<body>

<header>
  <h1>🍞 Treatza — Orders</h1>
  <span class="status" id="statusText">connecting…</span>
</header>

<main>
  <div id="loginBox" class="login" style="display:none">
    <div style="font-size:28px;margin-bottom:8px">🔒</div>
    <div style="font-weight:700;margin-bottom:4px">Enter admin key</div>
    <div style="font-size:12.5px;color:var(--inkfaint)">Same as ADMIN_KEY in your backend's .env file</div>
    <input id="keyInput" type="password" placeholder="Admin key">
    <button onclick="saveKeyAndLoad()">View orders</button>
  </div>

  <div id="dashboard" style="display:none">
    <div class="toolbar">
      <span id="countText">Loading…</span>
      <button class="refresh-btn" onclick="loadOrders()">Refresh</button>
    </div>
    <div id="ordersList"></div>
  </div>
</main>

<script>
  const API_BASE = window.location.origin;
  let ADMIN_KEY = localStorage.getItem('treatza_admin_key') || '';

  function fmt(n){ return '₹' + Number(n).toLocaleString('en-IN'); }

  function saveKeyAndLoad(){
    ADMIN_KEY = document.getElementById('keyInput').value.trim();
    if(!ADMIN_KEY) return;
    localStorage.setItem('treatza_admin_key', ADMIN_KEY);
    loadOrders();
  }

  async function loadOrders(){
    if(!ADMIN_KEY){
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
      return;
    }
    try{
      const res = await fetch(`${API_BASE}/api/orders?key=${encodeURIComponent(ADMIN_KEY)}`);
      if(res.status === 401){
        localStorage.removeItem('treatza_admin_key');
        ADMIN_KEY = '';
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('statusText').textContent = 'wrong key';
        return;
      }
      const orders = await res.json();
      document.getElementById('statusText').textContent = 'connected';
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      renderOrders(orders);
    }catch(e){
      document.getElementById('statusText').textContent = 'server unreachable';
    }
  }

  function renderOrders(orders){
    document.getElementById('countText').textContent = orders.length + ' order' + (orders.length===1?'':'s');
    const list = document.getElementById('ordersList');
    if(orders.length === 0){
      list.innerHTML = '<div class="empty">No orders yet. New orders will show up here automatically.</div>';
      return;
    }
    list.innerHTML = orders.map(o => {
      const payTag = o.paymentStatus === 'paid' ? '<span class="tag tag-paid">PAID</span>'
        : o.paymentStatus === 'awaiting_payment' ? '<span class="tag tag-awaiting">AWAITING PAYMENT</span>'
        : '<span class="tag tag-cod">CASH</span>';
      const itemsHtml = o.items.map(it => `<div><span>${it.qty}× ${it.name}</span><span>${fmt(it.qty*it.price)}</span></div>`).join('');
      const statuses = ['received','preparing','ready','completed'];
      const statusBtns = statuses.map(st =>
        `<button class="status-btn ${o.orderStatus===st?'active':''}" onclick="setStatus('${o.id}','${st}')">${st}</button>`
      ).join('');
      return `
        <div class="order">
          <div class="order-top">
            <div>
              <span class="order-id">${o.id}</span>
              ${payTag}
              <div class="order-date">${new Date(o.date).toLocaleString('en-IN')}</div>
            </div>
            <div style="text-align:right;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--inkfaint)">${o.fulfillment}</div>
          </div>
          <div class="cust">${o.name} · ${o.phone}</div>
          ${o.address ? `<div class="addr">${o.address}</div>` : ''}
          ${o.note ? `<div class="addr">Note: ${o.note}</div>` : ''}
          <div class="items">${itemsHtml}</div>
          <div class="total-row"><span>Total</span><span>${fmt(o.total)}</span></div>
          <div class="status-row">${statusBtns}</div>
        </div>`;
    }).join('');
  }

  async function setStatus(id, status){
    await fetch(`${API_BASE}/api/orders/${id}?key=${encodeURIComponent(ADMIN_KEY)}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ orderStatus: status })
    });
    loadOrders();
  }

  // auto-refresh every 15s
  loadOrders();
  setInterval(loadOrders, 15000);
</script>
</body>
</html>
